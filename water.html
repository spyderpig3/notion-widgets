<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Water Tracker</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #191919; /* Notion dark mode */
    overflow: hidden;
    font-family: "Nunito", sans-serif;
  }

  .wrapper {
    background: #191919;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    box-sizing: border-box;
  }

  .card {
    position: relative;
    background: #e0f2ff; /* light blue card */
    border: 3px solid #1e3a8a; /* deep blue border */
    border-radius: 16px;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 4px 0 #1e3a8a;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    overflow: visible;
    width: 280px;
  }

  .fill-bg {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 0%;
    background: #1e3a8a;
    opacity: 0.25;
    transition: height 0.6s ease;
    pointer-events: none;
  }

  .card.pop {
    transform: scale(1.05);
    box-shadow: 0 6px 0 #1e3a8a;
  }

  .icon {
    font-size: 36px;
    color: #3b82f6; /* bright blue icon */
  }

  .text {
    flex: 1;
  }

  .count {
    font-weight: 800;
    font-size: 24px;
    color: #1e3a8a;
  }

  .label {
    font-weight: 700;
    color: #1e3a8a;
  }

  .buttons {
    display: flex;
    gap: 8px;
    position: relative;
  }

  button {
    background: #3b82f6;
    border: 2px solid #1e3a8a;
    border-radius: 8px;
    width: 32px;
    height: 32px;
    font-size: 20px;
    font-weight: 700;
    color: #e0f2ff;
    cursor: pointer;
    position: relative;
    transition: transform 0.1s ease;
  }

  button:active {
    transform: scale(0.9);
  }

  .float {
    position: absolute;
    font-weight: 800;
    color: #1e3a8a;
    font-size: 20px;
    animation: rise 0.8s ease forwards;
    pointer-events: none;
  }

  @keyframes rise {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
  }
</style>
</head>
<body>

  <div class="wrapper">
    <div class="card" id="card">
      <div class="fill-bg" id="fillBg"></div>

      <div class="icon">💧</div>

      <div class="text">
        <div class="count" id="count">0/3</div>
        <div class="label">Drink water</div>
      </div>

      <div class="buttons">
        <button id="minus">−</button>
        <button id="plus">+</button>
      </div>
    </div>
  </div>

<script>
  const card = document.getElementById("card");
  const countEl = document.getElementById("count");
  const plus = document.getElementById("plus");
  const minus = document.getElementById("minus");
  const fillBg = document.getElementById("fillBg");

  let count = 0;
  const goal = 3;

  function loadState() {
    const savedCount = localStorage.getItem("waterCount");
    const savedDate = localStorage.getItem("waterDate");
    const today = new Date().toDateString();

    if (savedDate !== today) {
      count = 0;
      saveState();
    } else {
      count = savedCount ? parseInt(savedCount) : 0;
    }
    update();
  }

  function saveState() {
    localStorage.setItem("waterCount", count);
    localStorage.setItem("waterDate", new Date().toDateString());
  }

  function update() {
    countEl.textContent = `${count}/${goal}`;
    fillBg.style.height = `${(count / goal) * 100}%`;
  }

  function popCard() {
    card.classList.add("pop");
    setTimeout(() => card.classList.remove("pop"), 150);
  }

  function floatPlusOne(fromButton) {
    const float = document.createElement("div");
    float.textContent = "+1";
    float.className = "float";

    const rect = fromButton.getBoundingClientRect();
    float.style.left = rect.left + rect.width / 2 + "px";
    float.style.top = rect.top + rect.height / 2 + "px";

    document.body.appendChild(float);
    setTimeout(() => float.remove(), 800);
  }

  plus.onclick = () => {
    if (count < goal) {
      floatPlusOne(plus);
      popCard();
      count++;
      saveState();
      update();
    }
  };

  minus.onclick = () => {
    if (count > 0) {
      count--;
      saveState();
      update();
    }
  };

  setInterval(() => {
    loadState();
  }, 60 * 1000);

  loadState();
</script>

</body>
</html>
